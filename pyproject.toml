[project]
name = "app"
version = "0.1.0"
description = "CHANGE_ME"
readme = "README.md"
authors = [{ name = "CHANGE_ME", email = "CHANGE_ME" }]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-cov>=7.1.0", "ruff>=0.17.3", "mypy>=2.4.1"]

[tool.uv]
# Dependency cooldown: never resolve a release younger than this.
# Keep it equal to the cooldown in .github/dependabot.yml (tests/test_policy.py checks).
# Urgent fix that is newer? Exempt just that package: exclude-newer-package = { name = false }
exclude-newer = "7 days"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.coverage.run]
source = ["src", "scripts"]
branch = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "scripts"
