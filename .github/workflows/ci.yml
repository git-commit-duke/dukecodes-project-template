name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      UV_EXCLUDE_NEWER: "7 days"  # cooldown for uvx tools; keep equal to the Makefile COOLDOWN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history for the gitleaks history scan
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"  # newest uv past the 7-day cooldown; Dependabot can't bump this
      - name: pre-commit hooks on every file
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch  # guards local commits; CI also runs on main after a merge
      - name: gitleaks on the whole git history
        run: uvx pre-commit@4.7.0 run --hook-stage manual gitleaks-history --all-files
      - name: zizmor online audits (impostor commits, known-vulnerable actions)
        run: uvx zizmor@1.31.1 --format=github .
        env:
          GH_TOKEN: ${{ github.token }}
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"  # newest uv past the 7-day cooldown; Dependabot can't bump this
      - run: uv sync --locked
      - name: mypy (strict)
        run: uv run --locked mypy
      - name: pytest
        run: uv run --locked pytest --cov
  scan:
    runs-on: ubuntu-latest
    env:
      UV_EXCLUDE_NEWER: "7 days"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"  # newest uv past the 7-day cooldown; Dependabot can't bump this
      # SHA-pinned on purpose: trivy-action tags were hijacked in March 2026 (CVE-2026-33634)
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: semgrep (fails if no rules loaded)
        run: |
          out=$(uvx semgrep@1.181.0 scan --config p/default --metrics off --json --time --quiet .) || true
          rules=$(printf '%s' "$out" | jq -e '.time.rules | length') || rules=0
          findings=$(printf '%s' "$out" | jq -e '.results | length') || findings=-1
          echo "semgrep: $rules rules, $findings findings"
          test "$rules" -gt 0 || { echo "semgrep loaded no rules"; exit 1; }
          test "$findings" -eq 0 || { printf '%s' "$out" | jq -r '.results[] | "\(.path):\(.start.line) \(.check_id)"'; exit 1; }
  dependency-review:
    # Public repos: always runs. Private repos need GitHub Code Security; once it is on,
    # set the repository variable DEPENDENCY_REVIEW to true (Settings > Secrets and variables > Actions).
    if: >-
      github.event_name == 'pull_request' &&
      (!github.event.repository.private || vars.DEPENDENCY_REVIEW == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
