name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: install gitleaks 8.30.1
        run: |
          set -eu
          f=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$f"
          curl -fsSL -o sums "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt"
          grep " $f\$" sums | sha256sum -c -
          tar -xzf "$f" gitleaks && sudo install -m755 gitleaks /usr/local/bin/
      - name: gitleaks (full history)
        run: gitleaks git --redact --no-banner .

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The bare template has no package.json; a project made from it does, and then every step runs.
      - name: no package.json yet
        if: hashFiles('package.json') == ''
        run: echo "template without package.json; pnpm steps skipped"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: hashFiles('package.json') != ''
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('package.json') != ''
        with:
          node-version: 24
          cache: pnpm
      - if: hashFiles('package.json') != ''
        run: pnpm install --frozen-lockfile
      - if: hashFiles('package.json') != ''
        run: pnpm typecheck
      - if: hashFiles('package.json') != ''
        run: pnpm lint
      - if: hashFiles('package.json') != ''
        run: pnpm test
      - if: hashFiles('package.json') != ''
        run: pnpm build

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          comment-summary-in-pr: on-failure
