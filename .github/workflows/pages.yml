name: pages
# Publishes site/ to GitHub Pages. One-time setup: Settings > Pages > Source: GitHub Actions.
# Until then the check still runs and the deploy is skipped with a notice (no red X).
on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/check_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read  # only to ask whether Pages is turned on
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the page (lock hashes, project.json, CSP)
        run: python3 scripts/check_site.py
      - name: Check the page scripts parse
        run: node --check site/theme.js && node --check site/app.js
      - name: Is Pages turned on with GitHub Actions as the source?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! out=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>&1); then
            case "$out" in
              *"HTTP 404"*) out=off ;;
              *) echo "::error::Could not ask GitHub whether Pages is on: $out"; exit 1 ;;
            esac
          fi
          case "$out" in
            workflow) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
            legacy)
              echo "::notice title=Pages publishes from a branch::Switch Settings > Pages > Source to GitHub Actions, then re-run this workflow."
              echo "enabled=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice title=Pages is off::Turn it on in Settings > Pages > Source: GitHub Actions, then re-run this workflow."
              echo "enabled=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
